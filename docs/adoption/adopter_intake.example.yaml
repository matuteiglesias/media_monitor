schema: media_monitor_adopter_intake.v1
status: representative_example

organization:
  name: Example Intelligence Desk
  team: Research and Communications
  primary_operator_role: analyst
  primary_recipient_role: executive_team

use_case:
  class: executive_brief
  phase: pilot
  summary: >-
    Monitor a bounded public-source universe, prioritize relevant developments,
    let an analyst approve the final selection, and deliver a weekday morning brief.

sources:
  mode: adopter_provided_feed
  interface: to_be_defined
  update_cadence: hourly
  authentication: to_be_defined
  provenance_required: true
  retention_constraints: to_be_defined

watch_policy:
  geographies: [AR, UY, CL]
  languages: [es]
  topics:
    - regulation
    - infrastructure
    - political_risk
  freshness_hours: 24
  priority_rules: []
  diversity_expectations: preserve source and topic diversity
  exclusions: []

editorial_authority:
  assisted_generation: optional
  human_review_required: true
  human_approval_required_for_delivery: true
  auto_publish_generated_text: false
  evidence_links_required: true
  reviewer_roles: [analyst]
  approver_roles: [editor]

identity:
  name: Example Intelligence Desk
  locale: es-AR
  domain_mode: preview_first
  attribution: to_be_decided

privacy:
  mode: private
  authentication: pilot_level_to_be_defined
  sensitive_data_expected: false
  deployment_account_owner: undecided
  retention_constraints: to_be_defined
  audit_expectations: retain run and delivery evidence for pilot acceptance

deliverables:
  - type: html_email_brief
    cadence: weekdays
    delivery_window_local: "07:30-08:00"
    target_item_count: "5-10"
    freshness_target_minutes: 90

integration:
  inbound_owner: adopter
  outbound_owner: media_monitor_pilot
  required_identifiers: [source_id, external_item_id, published_at]
  failure_retry_expectation: bounded retry plus visible failed-delivery evidence
  systems_of_record: [adopter_source_feed]

pilot_acceptance:
  duration_days: 14
  freshness_target_minutes: 90
  operator_review_exercised: true
  recipient_delivery_exercised: true
  minimum_successful_scheduled_cycles: 5
  exclusions_documented: true
  termination_handoff_test: export pilot config and recipient artifacts without hidden state

commercial_path:
  evaluating: paid_pilot
  price: human_decision_required
  license_terms: human_decision_required
