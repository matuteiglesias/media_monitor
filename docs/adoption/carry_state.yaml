ap0_remaining_acceptance:
  - outsider evaluator can select an engagement path without architecture archaeology
  - outsider can distinguish proven surfaces from pilot-stage gaps
  - record L2 evidence before claiming offer_clarity target band

ap1_remaining_acceptance:
  - outsider completes intake without repository knowledge
  - deterministic plan is actionable with at most one clarification round
  - record L2 evidence before claiming requirements_intake target band

ap2_remaining_acceptance:
  - choose one real or representative adopter intake
  - create isolated provider preview URL without changing canonical Argentina deployment
  - independently verify adopter identity and no owner leakage
  - record commit intake hash config/source identity and preview URL/status
  - prove no adopter-specific generic-core edits

ap3_remaining_acceptance:
  - outsider/provider maps a representative real export to external_monitored_signal.v1
  - clean import completes without repository archaeology
  - provider/data-rights and retention assumptions are explicitly confirmed by the relevant human parties
  - repeated cycles required before any live-source claim

ap4_remaining_acceptance:
  - non-developer receives prepared queue without repository archaeology
  - non-developer records at least one hold revise or reject decision
  - safe representative approval is exercised into an isolated bus when appropriate
  - one deliberate validation/refusal case is recovered without storage or database surgery
  - record L2 evidence before claiming analyst_operator_comfort target band

ap5_remaining_acceptance:
  - choose real recipient channel and address under adopter privacy rules
  - prepare a package meeting real item-count and freshness requirements
  - explicitly authorize exact package bytes for delivery
  - external sender/provider performs the send
  - record provider or human delivery evidence bound to the manifest
  - recipient confirms usability
  - repeated cycles support any cadence or reliability claim

ap6_remaining_acceptance:
  - real evaluator uses packet without repository archaeology
  - owner resolves only the licensing legal privacy support SLA or commercial fields that actually block the selected path
  - dependency license review completed before contractual software delivery if code rights are part of the deal
  - runtime Node mismatch and unpinned scheduled jsonschema are either fixed or explicitly accepted before stronger reproducibility claims
  - durability/recovery position resolved before any backup or arbitrary-replay promise

seed_decisions:
  - adoption program lives under docs/adoption and owns no runtime
  - named prospects stay out of the public repo program
  - preserve multiple commercial forms until real evidence selects one
  - concierge onboarding and isolated deployments are acceptable
  - no generic multi_tenancy billing enterprise_sso or full_cms without demand
  - public claims remain evidence-calibrated

ap1_decisions:
  - use JSON Schema 2020-12 as intake authority while allowing YAML authoring
  - keep adoption schema under docs/adoption rather than contracts/schemas because it is not a runtime integration fact contract
  - compile requests into config adapter reusable-platform human-decision and out-of-scope buckets before engineering
  - reject auto-publication of generated text at schema validation time
  - keep pricing and licensing structurally reserved for human decision

ap2_decisions:
  - generate an isolated representative preview package rather than provisioning tenants
  - use synthetic intake-derived signals so bootstrap proof cannot masquerade as live news
  - exercise the real generic selection context and site-snapshot builders
  - bind preview identity to the intake SHA and snapshot provenance contract
  - fail on known Media Monitor owner/editor identity leakage
  - leave provider deployment status explicitly not_attempted

ap3_decisions:
  - make one stable file contract the provider boundary rather than hard-code vendor adapters
  - derive downstream identity deterministically from provider source and external identity
  - dedupe identical repeated observations while counting them
  - quarantine all occurrences of a semantically conflicting identity instead of selecting a winner
  - retain provider/source-record provenance on normalized rows
  - allow normalized external files to feed the same generic AP2 downstream compiler
  - do not claim a continuously operating live source from a one-file import

ap4_decisions:
  - reuse the existing editorial publication gate rather than create a parallel CMS authority
  - materialize source citations fact-check flags revision notes draft identity and SHA at review time
  - journal hold revise reject and approve decisions explicitly
  - non-approval decisions have no publication effect
  - approval continues to require explicit --approve-human
  - adopter rehearsal approval also requires an explicit isolated published-bus target
  - preserve the canonical promoter default for normal repository operation while making isolation injectable

ap5_decisions:
  - implement only the html_email_brief requested by the representative intake
  - build recipient content only from human-approved published_article.v1 records
  - make target item count an executable acceptance constraint
  - use adopter identity rather than source-site brand for recipient packaging
  - do not invent or persist recipient email addresses in seed tooling
  - separate prepare authorize and record authorities
  - no AP5 code path sends email or calls a provider
  - authorization binds exact manifest and brief hashes
  - later sent or delivered evidence requires an external provider reference

ap6_decisions:
  - make procurement state machine-readable and drift-validated rather than sales prose only
  - public repository visibility is not treated as a software license grant
  - preserve repository and commercial licensing as human decisions
  - surface scheduled Node 20 versus site Node 22.x as an open mismatch
  - treat the 120-minute freshness value as an implementation target not an SLA
  - state 14-day GitHub publication-evidence retention without implying historical durable backup
  - claim no certification penetration test or formal security audit without evidence
  - keep private authentication unproductized until a buyer earns the requirement
  - keep historical durability and replay promises outside this adoption packet until storage hardening closes
  - require all legal privacy support warranty liability pricing and transfer obligations to remain explicit human fields

known_blockers:
  - no real external adopter instance evidenced
  - no live adopter preview URL evidenced
  - no outsider/provider L2 validation of external import boundary
  - no non-developer L2 exercise of reviewer operation
  - no real-recipient L2 delivery evidence
  - no repository-level LICENSE file on seed baseline
  - no completed dependency license review for contractual software delivery
  - scheduled Node 20 versus site Node 22.x mismatch remains open
  - scheduled extra jsonschema remains unpinned
  - no human-approved pricing support SLA privacy warranty liability or transaction terms
  - historical durability/recovery promise remains outside adoption closure

human_decisions_reserved:
  - pricing and invoicing
  - repository/software licensing
  - legal privacy warranty liability and support commitments
  - prospect outreach and sends
  - acceptance of any real pilot or commercial terms
  - provider/account mutation for a real adopter preview unless explicitly delegated
  - confirmation of rights/permissions for real third-party source data
  - actual delivery to a real recipient when it communicates externally
  - explicit approval of real adopter editorial content
  - explicit authorization of a real recipient delivery
  - any signature contract or transfer of software source deployment or data rights

non_goals:
  - generic_multi_tenant_saas
  - billing_platform
  - enterprise_sso_without_buyer
  - full_newsroom_cms
  - connector_marketplace
  - generic_dashboard_suite
  - omnichannel_notifications_before_demand
  - fabricated_enterprise_certifications

