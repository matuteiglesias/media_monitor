ap8_truth_boundary:
  committed_accepted_adopter_record_exists: false
  first_real_external_adopter_accepted: false
  customer_or_adopter_claim_authorized_by_ap8: false
  acceptance_requires_evidence_class: real_external
  acceptance_requires_explicit_cli_confirmation: true
  representative_fixture_may_satisfy_acceptance: false
  pending_template_status: pending

real_world_execution_required:
  AP0:
    - outsider selects engagement path and distinguishes proven capability from pilot gaps
  AP1:
    - outsider completes validated intake with at most one clarification round
  AP2:
    - isolated adopter preview is actually deployed and independently identity-verified
  AP3:
    - representative-real provider/source path is exercised repeatedly and rights confirmed by human/provider
  AP4:
    - non-developer operator performs review cycle without storage/database surgery
  AP5:
    - real recipient receives exact authorized artifact and confirms usefulness; delivery evidence recorded
  AP6:
    - external evaluator uses procurement packet and selected-path blockers are resolved by humans
  AP7:
    - actual commercial/legal scope/terms are approved and counterparty acceptance/signature obtained as appropriate
  AP8:
    - real_external evidence record passes evaluator with --confirm-real-external-evidence and explicit human acceptance

known_blockers:
  - no real external adopter instance evidenced
  - no live adopter preview URL evidenced
  - no outsider/provider L2 source-boundary validation
  - no non-developer L2 reviewer exercise
  - no real-recipient L2 delivery evidence
  - no repository-level LICENSE file
  - no completed dependency-license review for contractual software delivery
  - scheduled Node 20 versus site Node 22.x mismatch remains open
  - scheduled extra jsonschema remains unpinned
  - no human-approved pricing support SLA privacy warranty liability or transaction terms
  - no real counterparty acceptance/signature
  - historical durability/recovery promise remains outside adoption closure

human_decisions_reserved:
  - pricing currency invoicing and payment terms
  - repository/software licensing and commercial rights
  - legal privacy warranty liability governing-law and support/SLA commitments
  - prospect outreach and sends
  - acceptance of real pilot/commercial terms
  - provider/account mutation for real preview unless explicitly delegated
  - rights/permissions for real third-party source data
  - real editorial approval and recipient-delivery authorization
  - real recipient addressing and external communication
  - signatures contracts and transfer of software source deployment domain provider-account or data rights
  - final first-adopter acceptance

non_goals:
  - generic_multi_tenant_saas
  - billing_platform
  - enterprise_sso_without_buyer
  - full_newsroom_cms
  - connector_marketplace
  - generic_dashboard_suite
  - omnichannel_notifications_before_demand
  - fabricated_enterprise_certifications
  - agent_generated_contract_terms
  - fake_adopter_acceptance

next_human_execution_order:
  - review_and_merge_stacked_PRs_in_dependency_order
  - choose_one_real_or_representative_external_adopter_candidate
  - run_AP0_AP1_outsider_evaluation
  - produce_and_verify_isolated_AP2_preview
  - exercise_AP3_source_boundary_and_rights
  - exercise_AP4_non_developer_review
