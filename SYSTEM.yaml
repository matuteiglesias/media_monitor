schema_version: 1
id: media.monitor
repository:
  id: repo.media-monitor
  github: matuteiglesias/media_monitor
domain: media
system: media-monitor
role: sensing-editorial-publication-system
lifecycle: active

naming:
  repository_slug: media_monitor
  system_id: media-monitor
  rule: "Keep the existing GitHub/path slug media_monitor where physically required; use hyphenated semantic/deployment surface IDs. Never treat '-' and '_' variants as interchangeable project identities."

surfaces:
  system_documentation:
    surface_id: media-monitor-docs
    path: docs-site
    kind: documentation-frontend
    content_authority: docs
    deployment_shape: separate-vercel-project
    recommended_vercel_project: media-monitor-docs
    instance_specific: false
  argentina_outlet:
    surface_id: media-monitor-argentina
    path: apps/news_site
    kind: configured-outlet-instance
    instance_config: sites/argentina-general.json
    public_identity: apps/news_site/config/public_identity.json
    deployment_shape: separate-vercel-project
    recommended_vercel_project: media-monitor-argentina
    status: incubated-in-repository
    extraction_policy: "May move to an instance repository later; do not make its Argentina-specific content or branding core system semantics."
  operator_last_mile:
    surface_id: media-monitor-last-mile
    path: web
    kind: operator-handoff-ui
    deployment_config: vercel.json
    status: retained-separate-surface
    note: "The root Vercel surface serves web/index.html and is neither the docs frontend nor the Argentina outlet."
  channel_monitor:
    surface_id: media-channel-monitor
    path: apps/channel_monitor
    kind: monitored-video-workbench
    status: m4-deterministic-product-proof

surface_invariants:
  - docs-site is presentation for canonical system documentation and must not own publication runtime routes
  - apps/news_site is one configured Argentina outlet instance, not the definition of Media Monitor
  - web is an operator last-mile surface and must not be confused with the public outlet
  - apps/channel_monitor is a separate monitored-video product surface
  - each deployable surface must be linked to an explicitly named deployment project/root; project names that differ only by '-' versus '_' are forbidden for new links

authority:
  status: existing-system-plus-monitored-media-product
  owns:
    - configured external media/news sensing
    - producer-local stable identities and observation evidence
    - deterministic selection and coverage context for the existing editorial product
    - human-gated publication state for the existing editorial product
    - monitored-media source registry, media-item identity, metadata snapshots, text-asset provenance, segments, appearance evidence, and deterministic operational indexes
  does_not_own:
    - platform content rights or permission to transcribe arbitrary third-party video
    - universal transcription or ASR architecture
    - speaker biometrics or voice identification
    - cross-platform person/entity resolution
    - generic semantic embeddings, retrieval, reranking, or clustering
    - shared knowledge interoperability schema authority
    - interpretation of an appearance as endorsement or political/economic belief

monitored_media_program:
  w0:
    status: merged
    evidence: contracts-fixtures-and-boundaries
  m1_m1p:
    status: merged-product-code-live-acceptance-blocked
    capabilities:
      - official YouTube uploads-playlist adapter
      - stable media-item identity and immutable metadata snapshots
      - freshness/read model
      - Latest / Outlets / Item Channel Monitor
    external_gate: "GitHub Actions YOUTUBE_API_KEY is still absent; official live acceptance must not be claimed until the workflow_dispatch gate succeeds."
  m2:
    status: deterministic-proof-green
    capabilities:
      - explicit governed text provenance states
      - replay-idempotent text assets
      - whole-item segments
      - publisher-description timestamp segments
      - unavailable and blocked states treated as valid monitoring outcomes
  m3:
    status: deterministic-proof-green
    configured_people:
      - carlos-melconian
      - marina-dal-poggetto
    capabilities:
      - title then description then governed-text appearance matching
      - evidence source and matched alias retained
      - regenerable latest/outlet/people/appearance/text-status/health indexes
  m4:
    status: deterministic-product-proof-green
    tabs:
      - Latest
      - People
      - Outlets
      - Search
      - Item
    search_capability: metadata_and_governed_text_literal_match
    product_invariant: source metadata, monitor/corpus state, and derived detection evidence remain visibly distinct
    pending_acceptance:
      - production build on main after merge
      - explicit Playwright browser acceptance via workflow_dispatch
      - official real-channel acceptance once YOUTUBE_API_KEY is configured in GitHub Actions
  stopping_rule: "Do not add ASR orchestration, speaker biometrics, semantic search, generic entity resolution, or shared workbench infrastructure before real-use evidence requires them."

interfaces:
  expected_downstream_after_real_text_exists:
    - repo.knowledge-inspect
    - repo.knowledge-experiences
  shared_contract_promotion: deferred until speech and media producers prove a genuinely common artifact shape
