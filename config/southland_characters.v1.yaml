schema_version: southland_characters.v1
principles:
  - "Aliases are stable universe names, not story-by-story jokes."
  - "Prefer phonetic or lexical wordplay over insults, accusations, or ideological labels."
  - "If a character has no locked alias, keep the real public name rather than improvising."
  - "A locked alias may be reused by text and image workflows; candidate aliases are reference-only."
  - "Character context describes recurrence in the Southland/LPO corpus, not a complete biography."

