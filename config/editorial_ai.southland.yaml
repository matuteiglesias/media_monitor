schema_version: editorial_ai.v1
workflow_id: southland-editorial-v2
backend:
  kind: maf_openai
  model_env: MEDIA_MONITOR_AI_MODEL
  api_key_env: OPENAI_API_KEY
execution:
  provider_concurrency: 4
  story_concurrency: 4
  max_attempts: 2
  max_revisions: 1
  minimum_inputs: 5
  publish_candidate_target: 3
editorial:
  alias_registry: config/southland_aliases.v1.yaml
  target_min_words: 450
  target_max_words: 700
  hard_min_words: 300
  hard_max_words: 850
  max_sections: 4
  max_literalizations: 2
  max_fictional_escalations: 2
