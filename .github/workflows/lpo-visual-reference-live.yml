name: LPO Visual Reference Live Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/lpo-visual-reference-live.yml"
      - "scripts/ingest_lpo_visual_refs.py"
      - "requirements-visuals.txt"
      - "config/sensing_feeds.southland.yaml"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-visuals.txt
      - name: Install visual ingestion runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-visuals.txt
      - name: Ingest current LPO reference batch
        run: |
          python scripts/ingest_lpo_visual_refs.py             --from-rss-config config/sensing_feeds.southland.yaml             --limit 20             --output-root /tmp/lpo-visual-reference             --verbose             | tee /tmp/lpo-visual-reference-report.json
      - name: Summarize corpus
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          from pathlib import Path

          root=Path("/tmp/lpo-visual-reference")
          articles=[
              json.loads(x) for x in (root/"manifests/lpo_articles.jsonl").read_text().splitlines()
              if x.strip()
          ]
          images=[
              json.loads(x) for x in (root/"manifests/lpo_images.jsonl").read_text().splitlines()
              if x.strip()
          ]
          ok=[x for x in images if x.get("download_status")=="ok"]
          credited=[x for x in images if x.get("credit_as_published")]
          print("# LPO visual-reference live batch")
          print()
          print(f"- articles: {len(articles)}")
          print(f"- article parse statuses: {dict(Counter(x.get('parse_status') for x in articles))}")
          print(f"- images discovered: {len(images)}")
          print(f"- images downloaded: {len(ok)}")
          print(f"- images with extracted credit: {len(credited)}")
          print(f"- roles: {dict(Counter(x.get('role') for x in images))}")
          print()
          print("## Sample images")
          for row in ok[:12]:
              print()
              print(f"- {row['image_id']} | {row.get('role')} | {row.get('width')}x{row.get('height')}")
              print(f"  - article: {row.get('article_urls',[None])[0]}")
              print(f"  - source image: {row.get('source_image_url')}")
              print(f"  - caption: {row.get('caption') or '(none)'}")
              print(f"  - credit: {row.get('credit_as_published') or '(none extracted)'}")
          PY
      - name: Upload runner-local reference corpus
        uses: actions/upload-artifact@v4
        with:
          name: lpo-visual-reference-live-${{ github.run_id }}
          retention-days: 3
          path: /tmp/lpo-visual-reference/**
