name: YouTube Channel Monitor

on:
  pull_request:
    paths:
      - "apps/media_watch/**"
      - "apps/channel_monitor/**"
      - "config/media_watch/**"
      - "tests/test_media_watch_m*.py"
      - "tests/test_channel_watch_digest.py"
      - "Dockerfile.media-watch-sidecar"
      - "requirements-media-watch-sidecar.txt"
      - "requirements-media-watch-ai.txt"
      - "bin/channel-watch-digest"
      - "bin/channel-monitor-live"
      - ".github/workflows/media-watch.yml"
      - "SYSTEM.yaml"
  push:
    branches: [main]
    paths:
      - "apps/media_watch/**"
      - "apps/channel_monitor/**"
      - "config/media_watch/**"
      - "tests/test_media_watch_m*.py"
      - "tests/test_channel_watch_digest.py"
      - "Dockerfile.media-watch-sidecar"
      - "requirements-media-watch-sidecar.txt"
      - "requirements-media-watch-ai.txt"
      - "bin/channel-watch-digest"
      - "bin/channel-monitor-live"
      - ".github/workflows/media-watch.yml"
      - "SYSTEM.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal media-watch test dependencies
        run: python -m pip install pytest jsonschema requests PyYAML
      - name: Verify monitoring, enrichment, appearances and read models
        run: python -m pytest -q tests/test_media_watch_m1.py tests/test_media_watch_m2_m4.py tests/test_media_watch_m5_summary.py tests/test_media_watch_m5_http_bridge.py tests/test_media_watch_m7_evidence_export.py tests/test_channel_watch_digest.py
      - name: Build private YouTube sidecar container
        run: docker build -f Dockerfile.media-watch-sidecar -t media-monitor-youtube-sidecar:test .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck Media Intelligence Workbench
        working-directory: apps/channel_monitor
        run: |
          npm install --no-audit --no-fund
          npm run typecheck

  production-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Production build
        working-directory: apps/channel_monitor
        env:
          NEXT_PUBLIC_CHANNEL_MONITOR_API_BASE: http://127.0.0.1:9100
        run: |
          npm install --no-audit --no-fund
          npm run build

  fixture-browser-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install bounded acceptance dependencies
        run: python -m pip install jsonschema requests PyYAML
      - name: Seed deterministic governed M2-M4 fixture and start read API
        run: |
          python -m apps.media_watch.enrichment_fixture --store-root artifacts/runs/media-watch-m4-fixture/store
          python -m apps.media_watch.api --store-root artifacts/runs/media-watch-m4-fixture/store --port 9100 > artifacts/runs/media-watch-m4-fixture/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9100/healthz && exit 0; sleep 1; done
          exit 1
      - name: Build and start Media Intelligence Workbench
        working-directory: apps/channel_monitor
        env:
          NEXT_PUBLIC_CHANNEL_MONITOR_API_BASE: http://127.0.0.1:9100
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run start > ../../artifacts/runs/media-watch-m4-fixture/frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3010/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Install Chromium and exercise Latest → People → Search → Item → Outlets
        working-directory: apps/channel_monitor
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload mature workbench proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-intelligence-m4-fixture-proof
          path: |
            artifacts/runs/media-watch-m4-fixture
            apps/channel_monitor/artifacts
            apps/channel_monitor/test-results
          if-no-files-found: warn

  official-youtube-live-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require official API credential
        shell: bash
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY is required for the manual live acceptance gate."
            exit 1
          fi
      - name: Install bounded media-watch runtime
        run: python -m pip install jsonschema requests PyYAML
      - name: Reconcile two real channels through official uploads playlists and replay
        run: |
          mkdir -p artifacts/runs/media-watch-m1-live
          python -m apps.media_watch.monitor --limit 10 --store-root artifacts/runs/media-watch-m1-live/store --evidence-root artifacts/runs/media-watch-m1-live/evidence | tee artifacts/runs/media-watch-m1-live/monitor.log
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('artifacts/runs/media-watch-m1-live/evidence/m1_manifest.json').read_text())
          assert manifest['acceptance_green'] is True
          assert set(manifest['sources']) == {'el-destape-youtube','futurock-youtube'}
          assert all(row['observations'] >= 10 for row in manifest['sources'].values())
          assert manifest['replay_materialization']['new_items'] == 0
          assert manifest['replay_materialization']['new_snapshots'] == 0
          PY
      - name: Verify real read-model activity
        run: |
          python -m apps.media_watch.api --store-root artifacts/runs/media-watch-m1-live/store --port 9100 > artifacts/runs/media-watch-m1-live/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9100/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:9100/api/channel-monitor | tee artifacts/runs/media-watch-m1-live/overview.json
          curl -fsS 'http://127.0.0.1:9100/api/items?limit=5' | tee artifacts/runs/media-watch-m1-live/latest.json
      - name: Upload M1 live gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-watch-m1-live-gate
          path: artifacts/runs/media-watch-m1-live
          if-no-files-found: warn

  live-summary-recovery-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require live summary credentials
        shell: bash
        run: |
          if [ -z "$YOUTUBE_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "YOUTUBE_API_KEY and GEMINI_API_KEY are required for the live summary gate."
            exit 1
          fi
      - name: Install governed sidecar runtime
        run: python -m pip install -r requirements-media-watch-sidecar.txt
      - name: Reconcile recent configured channel state
        run: |
          mkdir -p artifacts/runs/media-watch-live-summary
          python -m apps.media_watch.monitor \
            --limit 5 \
            --store-root artifacts/runs/media-watch-live-summary/store \
            --evidence-root artifacts/runs/media-watch-live-summary/acquisition
      - name: Generate summaries serially and prove cache plus digest visibility
        run: |
          python -m apps.media_watch.live_summary_acceptance \
            --store-root artifacts/runs/media-watch-live-summary/store \
            --output-root artifacts/runs/media-watch-live-summary/acceptance \
            --min-successes 2 \
            --limit-per-source 3
      - name: Upload live summary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-watch-live-summary-acceptance
          path: artifacts/runs/media-watch-live-summary
          if-no-files-found: warn

