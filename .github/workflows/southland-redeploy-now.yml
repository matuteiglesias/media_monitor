name: Southland Redeploy Now

on:
  pull_request:
    paths:
      - ".github/workflows/southland-redeploy-now.yml"

permissions:
  contents: read

concurrency:
  group: southland-current-production-redeploy
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: "59.23.2"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.SOUTHLAND_VERCEL_PROJECT_ID }}
  SOUTHLAND_PUBLIC_OUTLET_URL: ${{ vars.SOUTHLAND_PUBLIC_OUTLET_URL || 'https://southland-news.vercel.app' }}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded runtime and Vercel CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai.txt jsonschema requests PyYAML
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SOUTHLAND_PUBLIC_OUTLET_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required deployment setting: $name" >&2
              exit 1
            fi
          done

      - name: Compile fresh Southland monitored-source snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(date -u +%Y%m%dT%H)"
          echo "Compiling Southland source snapshot for $DIGEST"

          python scripts/refresh_outlet_evidence.py             --site-id southland             --digest-at "$DIGEST"

          python scripts/compile_outlet.py             --site-id southland             --digest-at "$DIGEST"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path(".runtime/southland/storage/public/site_snapshot.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_name") != "site_snapshot.v4":
              raise SystemExit(f"unexpected snapshot schema: {payload.get('schema_name')!r}")
          if payload.get("site", {}).get("site_id") != "southland":
              raise SystemExit(f"unexpected site identity: {payload.get('site')!r}")
          if int(payload.get("metrics", {}).get("published_article_count") or 0) != 0:
              raise SystemExit("fresh code-only materialization unexpectedly contains published articles")
          for key in ("snapshot_id", "digest_at"):
              value = str(payload.get(key) or "").strip()
              if not value:
                  raise SystemExit(f"snapshot missing {key}")
              print(f"{key}={value}")
          print("published_article_count=0")
          PY

      - name: Materialize current main with resolved snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_outlet_site.py --site-id southland
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path(".runtime/southland/storage/public/site_snapshot.json").read_text(encoding="utf-8"))
          target = json.loads(Path("apps/news_site/public/data/site_snapshot.json").read_text(encoding="utf-8"))
          if source.get("snapshot_id") != target.get("snapshot_id"):
              raise SystemExit("materialized snapshot ID differs from fresh Southland snapshot")
          if source.get("digest_at") != target.get("digest_at"):
              raise SystemExit("materialized digest differs from recovered production snapshot")
          print(f"materialized snapshot={target['snapshot_id']} digest={target['digest_at']}")
          PY

      - name: Link and pull Southland Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(".vercel/project.json").write_text(
              json.dumps({
                  "orgId": os.environ["VERCEL_ORG_ID"],
                  "projectId": os.environ["VERCEL_PROJECT_ID"],
              }) + "\n",
              encoding="utf-8",
          )
          PY
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build latest main against current Southland snapshot
        shell: bash
        env:
          SITE_ID: southland
          DIGEST_AT: ${{ steps.snapshot.outputs.digest_at }}
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          vercel build --prod --token "$VERCEL_TOKEN"
          test -f .vercel/output/config.json

      - name: Deploy prebuilt production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" 2>&1)"
          printf '%s\n' "$OUTPUT"

          HOST="$(printf '%s\n' "$OUTPUT" | python -c '
          import re, sys
          text=sys.stdin.read()
          hosts=sorted(set(re.findall(r"(?:https?://)?([a-z0-9][a-z0-9-]*\.vercel\.app)(?:\b|/)", text, re.I)))
          if len(hosts) != 1:
              raise SystemExit(f"expected one deployment host, got {hosts}")
          print(hosts[0].lower())
          ')"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and canonical Southland domain
        shell: bash
        env:
          EXPECTED_SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          EXPECTED_DIGEST_AT: ${{ steps.snapshot.outputs.digest_at }}
          DEPLOYMENT_HOST: ${{ steps.deploy.outputs.host }}
        run: |
          set -euo pipefail

          verify_health () {
            local url="$1"
            local output="$2"
            curl --fail --silent --show-error --location --retry 2               "${url%/}/api/health" --output "$output"
            HEALTH_PATH="$output" python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path(os.environ["HEALTH_PATH"]).read_text(encoding="utf-8"))
          required={
              "status":"ok",
              "site_id":"southland",
              "snapshot_id":os.environ["EXPECTED_SNAPSHOT_ID"],
              "digest_at":os.environ["EXPECTED_DIGEST_AT"],
          }
          bad={k:{"expected":v,"observed":payload.get(k)} for k,v in required.items() if payload.get(k)!=v}
          if bad:
              raise SystemExit(f"health identity mismatch: {bad}")
          print(json.dumps({k:payload.get(k) for k in required}, ensure_ascii=False))
          PY
          }

          verify_health "https://$DEPLOYMENT_HOST" /tmp/deployment-health.json

          ok=0
          for attempt in $(seq 1 12); do
            if verify_health "$SOUTHLAND_PUBLIC_OUTLET_URL" /tmp/canonical-health.json; then
              ok=1
              break
            fi
            echo "Canonical domain not updated yet (attempt $attempt/12)"
            sleep 5
          done
          test "$ok" = "1"

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Southland code-only redeploy"
            echo
            echo "- Git SHA: `$GITHUB_SHA`"
            echo "- Snapshot: `${{ steps.snapshot.outputs.snapshot_id }}`"
            echo "- Digest: `${{ steps.snapshot.outputs.digest_at }}`"
            echo "- Published articles preserved: `${{ steps.snapshot.outputs.published_article_count }}`"
            echo "- Deployment host: `${{ steps.deploy.outputs.host }}`"
            echo "- Canonical URL: `$SOUTHLAND_PUBLIC_OUTLET_URL`"
          } >> "$GITHUB_STEP_SUMMARY"
