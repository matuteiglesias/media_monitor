name: Southland Prepare Live Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/southland-prepare-live-diagnostic.yml"
      - "apps/news_editorial/**"
      - "scripts/run_outlet_ai.py"
      - "scripts/refresh_outlet_evidence.py"

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MEDIA_MONITOR_AI_MODEL: ${{ vars.MEDIA_MONITOR_AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ai.txt
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ai.txt jsonschema requests PyYAML
      - name: Resolve digest
        id: digest
        shell: bash
        run: |
          DIGEST="$(date -u +%Y%m%dT%H)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Build current source evidence
        run: |
          python scripts/refresh_outlet_evidence.py             --site-id southland             --digest-at "${{ steps.digest.outputs.digest }}"
      - name: Run governed Southland editorial DAG
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$MEDIA_MONITOR_AI_MODEL"
          python scripts/run_outlet_ai.py             --site-id southland             --digest-at "${{ steps.digest.outputs.digest }}"
      - name: Publish human review packet
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path(".runtime/southland")
          report = json.loads((root / "storage/observability/editorial_ai_latest.json").read_text())
          print("# Southland prepared issue")
          print()
          print(f"- Digest: `{report['digest_at']}`")
          print(f"- Inputs: {report['input_count']}")
          print(f"- Accepted drafts: {report['accepted_count']}")
          print(f"- Rejected: {report['rejected_count']}")
          print()
          print("## Drafts for human review")
          for path_text in report["draft_paths"]:
              path = Path(path_text)
              row = json.loads(path.read_text())
              print()
              print(f"### {row['draft_id']} — {row['title']}")
              print()
              print(row["summary"])
              print()
              print(row["body_md"])
              print()
              print("Sources:")
              for url in row["source_links"]:
                  print(f"- {url}")
          PY
      - name: Upload prepared isolated runtime
        uses: actions/upload-artifact@v4
        with:
          name: southland-prepared-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          path: .runtime/southland/**
