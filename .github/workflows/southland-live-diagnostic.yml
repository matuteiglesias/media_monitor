name: Southland Live Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/southland-live-diagnostic.yml"
      - "config/sensing_feeds.southland.yaml"
      - "apps/news_acquire/**"
      - "scripts/refresh_outlet_evidence.py"
      - "scripts/export_pr3a_buses.py"
      - "scripts/build_news_access_indexes.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sensing runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-sensing.txt requests PyYAML
      - name: Probe configured LPO feeds
        shell: bash
        run: |
          python - <<'PY'
          import requests, yaml, feedparser
          from pathlib import Path
          cfg=yaml.safe_load(Path("config/sensing_feeds.southland.yaml").read_text())
          for row in cfg["feeds"]:
              url=row["url"]
              print("\n==", row["topic"], url)
              try:
                  r=requests.get(url, timeout=15, allow_redirects=True, headers={"User-Agent":"media-monitor-diagnostic/1"})
                  print("requests", r.status_code, r.url, r.headers.get("content-type"), "bytes", len(r.content))
                  print("prefix", repr(r.text[:160]))
              except Exception as e:
                  print("requests ERROR", type(e).__name__, e)
              try:
                  f=feedparser.parse(url)
                  print("feedparser status", getattr(f,"status",None), "href", getattr(f,"href",None), "bozo", getattr(f,"bozo",None), "entries", len(getattr(f,"entries",[])))
                  if getattr(f,"bozo",None):
                      print("bozo_exception", repr(getattr(f,"bozo_exception",None)))
                  for entry in getattr(f,"entries",[])[:2]:
                      print("entry", getattr(entry,"published",None), getattr(entry,"title",None), getattr(entry,"link",None))
              except Exception as e:
                  print("feedparser ERROR", type(e).__name__, e)
          PY
      - name: Probe candidate LPO coverage feeds
        shell: bash
        run: |
          python - <<'PY'
          import feedparser
          candidates = [
              "ultimasnoticias.xml",
              "congreso.xml",
              "internacionales.xml",
              "justicia.xml",
              "judiciales.xml",
              "energia.xml",
              "energía.xml",
              "cordoba.xml",
              "mendoza.xml",
              "transporte.xml",
              "entrevista.xml",
          ]
          base="http://www.lapoliticaonline.com.ar/files/rss/"
          for name in candidates:
              f=feedparser.parse(base+name)
              entries=getattr(f,"entries",[])
              newest=getattr(entries[0],"published",None) if entries else None
              print(name, "status", getattr(f,"status",None), "entries", len(entries), "newest", newest, "href", getattr(f,"href",None))
          PY
      - name: Count unique current stories by candidate horizon
        shell: bash
        run: |
          python - <<'PY'
          import feedparser, yaml
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          cfg=yaml.safe_load(Path("config/sensing_feeds.southland.yaml").read_text())
          now=datetime.now(timezone.utc)
          rows={}
          for feed in cfg["feeds"]:
              parsed=feedparser.parse(feed["url"])
              for e in getattr(parsed,"entries",[]):
                  url=getattr(e,"link","")
                  published=getattr(e,"published","") or getattr(e,"updated","")
                  try: dt=parsedate_to_datetime(published).astimezone(timezone.utc)
                  except Exception: continue
                  if url and (url not in rows or dt > rows[url][0]):
                      rows[url]=(dt, feed["topic"], getattr(e,"title",""))
          print("unique_total", len(rows), "newest", max((v[0] for v in rows.values()), default=None))
          for hours in [3,6,12,24,30,36,48,72]:
              selected=[(u,*v) for u,v in rows.items() if (now-v[0]).total_seconds() <= hours*3600]
              print("horizon_hours", hours, "count", len(selected))
              for u,dt,topic,title in sorted(selected,key=lambda x:x[1],reverse=True)[:12]:
                  print(" ", dt.isoformat(), topic, title[:90])
          PY
      - name: Run current Southland sensing pipeline with full stage output
        shell: bash
        run: |
          export DIGEST_AT="$(date -u +%Y%m%dT%H)"
          export DATA_DIR="$PWD/.runtime/southland/data"
          export STORAGE_DIR="$PWD/.runtime/southland/storage"
          export SENSING_FEED_CONFIG="$PWD/config/sensing_feeds.southland.yaml"
          export SENSING_SOURCE_NAME="La Política Online"
          export SENSING_RECENT_WINDOW_HOURS=36
          export ACQUIRE_NETWORK=1 WRITE_ARTIFACTS=1 ENQUEUE_SCRAPE=0 DB_RUN_BOOKKEEPING=0 DRY_RUN=0 PYTHONPATH="$PWD"
          echo "DIGEST_AT=$DIGEST_AT"
          set -x
          python -m apps.news_acquire.src.news_acquire.stage01_digests
          python -m apps.news_acquire.src.news_acquire.stage02_master_index_update
          python -m apps.news_acquire.src.news_acquire.stage03_headlines_digests
          python scripts/export_pr3a_buses.py --digest-at "$DIGEST_AT" --data-dir "$DATA_DIR" --storage-dir "$STORAGE_DIR" --contracts-dir "$PWD/contracts"
          set +x
          echo "=== generated files ==="
          find .runtime/southland -maxdepth 6 -type f -printf '%p %s bytes\n' | sort
          echo "=== pr3a latest ==="
          cat "$STORAGE_DIR/indexes/pr3a_exports_latest.json" || true
          echo "=== compact ==="
          cat "$STORAGE_DIR/indexes/pr3a_export_compact_latest.json" || true
          echo "=== news_ref manifest(s) ==="
          for f in "$STORAGE_DIR"/buses/news_ref/v1/manifest_*.json; do [ -e "$f" ] && cat "$f"; done
          echo "=== digest group manifest(s) ==="
          for f in "$STORAGE_DIR"/buses/news_digest_group/v1/manifest_*.json; do [ -e "$f" ] && cat "$f"; done
          echo "=== build access ==="
          python scripts/build_news_access_indexes.py --digest-at "$DIGEST_AT" --storage-dir "$STORAGE_DIR"
          echo "=== actual refresh_outlet_evidence from clean runtime ==="
          rm -rf .runtime/southland
          python scripts/refresh_outlet_evidence.py --site-id southland --digest-at "$DIGEST_AT"
