name: Scheduled public refresh

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      digest_at:
        description: "Optional current UTC digest (YYYYMMDDTHH); old/future production replays are refused"
        required: false
        type: string

concurrency:
  group: scheduled-publication-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_ID: argentina-general
  PUBLICATION_TARGET_MINUTES: "120"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  refresh-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sensing.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bounded runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-sensing.txt jsonschema
          npm install --global vercel@latest

      - name: Resolve monotonic production digest
        env:
          REQUESTED_DIGEST: ${{ github.event.inputs.digest_at }}
        run: |
          DIGEST="$(python scripts/publication_cycle_guard.py resolve --requested "${REQUESTED_DIGEST:-}")"
          echo "DIGEST_AT=${DIGEST}" >> "$GITHUB_ENV"
          echo "Resolved production digest: ${DIGEST}"

      - name: Verify CI deployment credentials and materialize Vercel link
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("VERCEL_TOKEN", "VERCEL_ORG_ID", "VERCEL_PROJECT_ID")
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))

          link = Path(".vercel/project.json")
          link.parent.mkdir(parents=True, exist_ok=True)
          link.write_text(
              json.dumps(
                  {
                      "orgId": os.environ["VERCEL_ORG_ID"],
                      "projectId": os.environ["VERCEL_PROJECT_ID"],
                  }
              ) + "\n",
              encoding="utf-8",
          )
          print("Vercel project link materialized from CI secrets")
          PY
          vercel whoami --token "$VERCEL_TOKEN" >/dev/null

      - name: Run live sensing lane
        env:
          DRY_RUN: "0"
          ACQUIRE_NETWORK: "1"
          WRITE_ARTIFACTS: "1"
          ENQUEUE_SCRAPE: "0"
          DB_RUN_BOOKKEEPING: "0"
          OPERATOR: github-actions-publication
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'timer' || 'manual' }}
          ATTEMPT: ${{ github.run_attempt }}
        run: bin/run_minimal_loop_once.sh --lane sensing

      - name: Gate coherence and freshness before deployment
        run: |
          python scripts/publication_cycle_guard.py validate \
            --site-id "$SITE_ID" \
            --digest-at "$DIGEST_AT" \
            --target-minutes "$PUBLICATION_TARGET_MINUTES"

      - name: Compile, deploy and verify immutable production snapshot
        run: |
          python scripts/roll_site.py \
            --site-id "$SITE_ID" \
            --digest-at "$DIGEST_AT" \
            --target production

      - name: Verify public endpoint anonymously
        run: |
          python scripts/verify_public_deployment.py \
            --roll-record "storage/observability/site_roll_latest_${SITE_ID}.json"

      - name: Publish cycle summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## Scheduled public refresh")
          for label, path in (
              ("Predeploy guard", Path("storage/observability/publication_cycle_guard_latest.json")),
              ("Site roll", Path("storage/observability/site_roll_latest_argentina-general.json")),
              ("Public check", Path("storage/observability/public_deployment_check_latest.json")),
          ):
              if not path.exists():
                  print(f"- **{label}:** no record (cycle stopped earlier)")
                  continue
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"- **{label}:** unreadable ({exc})")
                  continue
              detail = payload.get("error") or payload.get("failed_stage") or "ok"
              print(f"- **{label}:** `{payload.get('status', 'unknown')}` — {detail}")
          PY

      - name: Upload publication-cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            storage/observability/**
            storage/runs/**
            storage/indexes/pr3a_exports_latest.json
            storage/indexes/news_recent_refs_latest.jsonl
            storage/indexes/news_recent_groups_latest.jsonl
            apps/news_site/public/data/site_snapshot.json
